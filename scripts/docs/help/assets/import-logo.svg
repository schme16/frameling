<?xml version="1.0" encoding="UTF-8"?>
<!-- A small badge for the help pictures: layers, groups, gradients, text, and three things Frameling can't carry (a blur, a dashed ring, a mask). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ef476f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <mask id="fade"><rect width="320" height="240" fill="#ffffff"/></mask>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Background" id="layer1">
    <rect width="320" height="240" rx="24" fill="#26324d"/>
    <circle cx="160" cy="110" r="84" fill="url(#glow)"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Badge" id="layer2">
    <g id="sun">
      <circle cx="160" cy="110" r="58" fill="url(#sun)" stroke="#fff3d6" stroke-width="6"/>
      <path d="M160 70 L172 98 L202 100 L179 119 L187 148 L160 132 L133 148 L141 119 L118 100 L148 98 Z" fill="#fff3d6"/>
    </g>
    <circle cx="160" cy="110" r="72" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6"/>
    <ellipse cx="160" cy="178" rx="52" ry="8" fill="#000000" opacity="0.35" filter="url(#soft)"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Words" id="layer3" mask="url(#fade)">
    <text x="160" y="212" font-family="Nunito, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#ffffff">FRAMELING</text>
  </g>
</svg>

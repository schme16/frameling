<!doctype html>
<html><head><meta charset="utf-8"><title>Phaser check</title>
<style>html,body{margin:0;background:#808080}</style></head>
<body><div id="stage"></div>
<script src="/engines/phaser.min.js"></script>
<script src="/harness/common.js"></script>
<script>
// Loads Frameling's atlas and animations json the way the Phaser help topic says, plays every animation, and checks
// names, counts, speed, looping, timing and the pixels of the frames against Frameling's own PNGs.
window.runCheck = async function (cfg) {
  const r = WE.report();
  const game = await new Promise((resolve, reject) => {
    const g = new Phaser.Game({
      type: Phaser.WEBGL, width: cfg.width, height: cfg.height, parent: 'stage', transparent: true,
      audio: { noAudio: true }, banner: false,
      render: { pixelArt: true, antialias: false, preserveDrawingBuffer: true },
      scene: {
        preload() {
          this.load.atlas(cfg.key, cfg.image, cfg.json);
          if (cfg.anims) this.load.animation(cfg.key + '-anims', cfg.anims);
          this.load.on('loaderror', (f) => r.problem(`Phaser could not load ${f.url}`));
        },
        create() { resolve(g); },
      },
    });
    setTimeout(() => reject(new Error('Phaser never got to create()')), 20000);
  });
  const scene = game.scene.scenes[0];
  r.notes.push(`Phaser ${Phaser.VERSION}, ${game.renderer.type === Phaser.WEBGL ? 'WebGL' : 'canvas'}`);
  const tex = scene.textures.get(cfg.key);
  const frameNames = tex.getFrameNames();
  r.expect(frameNames.length === cfg.frameNames.length && cfg.frameNames.every((n) => frameNames.includes(n)),
    `frame names in Phaser (${frameNames.length}) are not the json's (${cfg.frameNames.length})`);
  const nextRender = () => new Promise((res) => game.events.once('postrender', res));

  for (const exp of cfg.animations) {
    const anim = scene.anims.get(exp.name);
    if (!r.expect(!!anim, `animation "${exp.name}" was not created`)) continue;
    r.expect(anim.frames.length === exp.count, `${exp.name}: ${anim.frames.length} frames, wanted ${exp.count}`);
    r.expect(anim.frameRate === exp.fps && WE.near(anim.msPerFrame, 1000 / exp.fps, 0.01), `${exp.name}: frame rate ${anim.frameRate} (${anim.msPerFrame} ms a frame), wanted ${exp.fps}`);
    // A forward or backward clip that plays N times is one pass with Phaser's own repeat (N - 1); a loop is -1.
    const times = exp.times || 1;
    const wantRepeat = exp.loop ? -1 : times - 1;
    r.expect(anim.repeat === wantRepeat, `${exp.name}: repeat ${anim.repeat}, wanted ${wantRepeat}`);
    r.expect(WE.near(anim.duration, exp.count * 1000 / exp.fps, 1), `${exp.name}: lasts ${anim.duration} ms, wanted ${exp.count * 1000 / exp.fps}`);
    r.expect(anim.frames.every((f) => f.textureKey === cfg.key && frameNames.includes(f.textureFrame)), `${exp.name}: a frame points at a missing texture frame`);

    // Pixels: show frame i of the animation on a sprite and compare with Frameling's picture of that document frame.
    const sprite = scene.add.sprite(0, 0, cfg.key).setOrigin(0, 0);
    sprite.play(exp.name);
    sprite.anims.pause();
    for (const c of exp.checks) {
      sprite.anims.setCurrentFrame(anim.frames[c.i]);
      await nextRender();
      await nextRender();
      await r.pixel(`${exp.name}[${c.i}]`, game.canvas, cfg.width, cfg.height, c.ref);
    }
    sprite.destroy();

    // Time: really play it and watch which frames come and when. A hiccup on a slow machine can spoil one go, so it gets three.
    if (exp.count >= 2 && exp.count / exp.fps <= 6) {
      let probs = [];
      for (let attempt = 0; attempt < 3; attempt++) {
        probs = [];
        const ex = (cond, t) => { if (!cond) probs.push(t); };
        const s2 = scene.add.sprite(0, 0, cfg.key).setOrigin(0, 0);
        const seen = [];
        let t0 = 0;
        let tRepeat = 0;
        let tEnd = 0;
        let repeats = 0;
        s2.on(Phaser.Animations.Events.ANIMATION_START, () => { t0 = performance.now(); });
        s2.on(Phaser.Animations.Events.ANIMATION_UPDATE, (a, f) => seen.push(f.index));
        s2.on(Phaser.Animations.Events.ANIMATION_REPEAT, () => { repeats++; if (!tRepeat) tRepeat = performance.now(); });
        s2.on(Phaser.Animations.Events.ANIMATION_COMPLETE, () => { tEnd = performance.now(); });
        s2.play(exp.name);
        const total = exp.count * 1000 / exp.fps;
        await WE.sleep(exp.loop ? total * 1.6 + 300 : total * times + 600);
        // The first frame starts the animation, then each change reports the new frame (1 is the first).
        const first = [1, ...seen].slice(0, exp.count);
        ex(first.length === exp.count && first.every((v, k) => v === k + 1), `${exp.name}: frames played in the order ${first.join(',')}`);
        if (exp.loop) {
          ex(tRepeat > 0, `${exp.name}: a looping animation never repeated`);
          if (tRepeat) ex(WE.near(tRepeat - t0, total, Math.max(60, total * 0.08)), `${exp.name}: one pass took ${Math.round(tRepeat - t0)} ms, wanted ${Math.round(total)}`);
        } else {
          ex(tEnd > 0, `${exp.name}: a clip that does not loop never finished`);
          if (tEnd) ex(WE.near(tEnd - t0, total * times, Math.max(60, total * times * 0.08)), `${exp.name}: it took ${Math.round(tEnd - t0)} ms, wanted ${Math.round(total * times)}`);
          ex(repeats === times - 1, `${exp.name}: repeated ${repeats} times, wanted ${times - 1}`);
          ex(s2.frame.name === anim.frames[anim.frames.length - 1].textureFrame, `${exp.name}: did not stop on its last frame (${s2.frame.name})`);
        }
        s2.destroy();
        if (!probs.length) break;
      }
      probs.forEach((t) => r.problem(t));
    } else {
      r.notes.push(`${exp.name}: timing not played (${exp.count} frames)`);
    }
  }
  game.destroy(true);
  return WE.plain(r);
};
</script></body></html>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- A small file in the shape Inkscape writes: layers, a transform, a gradient, inline styles. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink" width="200mm" height="100mm" viewBox="0 0 200 100">
  <sodipodi:namedview id="base" inkscape:zoom="1"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#102040;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#4080ff;stop-opacity:1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Sky" id="layer1">
    <rect x="0" y="0" width="200" height="100" style="fill:url(#sky);stroke:none"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Hero" id="layer2" transform="translate(20,10)">
    <g id="body">
      <circle cx="30" cy="30" r="10" style="fill:#ffcc00;stroke:#000000;stroke-width:2;stroke-linejoin:round"/>
      <path d="M 20,40 L 40,40 L 30,70 Z" style="fill:#ff0000;fill-opacity:0.5;stroke:none"/>
    </g>
    <path d="M 0,0 C 10,-10 20,10 30,0" style="fill:none;stroke:#00aa00;stroke-width:3;filter:url(#blur)"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Notes" id="layer3" style="display:none">
    <text x="5" y="95" style="font-size:8px;font-family:Arial;fill:#ffffff">Hi</text>
  </g>
</svg>

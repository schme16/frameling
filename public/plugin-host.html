<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The plugin sandbox (src/plugins/sandbox.ts, docs/plugins.md). Loaded in an iframe with sandbox="allow-scripts", so
         it has no origin of its own and can't reach the app. This page only starts the plugin's worker and hands it the
         port to Frameling. No network at all: connect-src 'none'. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Plugin</title>
  </head>
  <body>
    <script>
      (function () {
        var started = false;
        window.addEventListener('message', function (e) {
          if (started || e.source !== window.parent) return;
          var d = e.data;
          if (!d || d.t !== 'start' || !e.ports || !e.ports[0] || typeof d.prelude !== 'string') return;
          started = true;
          var url = URL.createObjectURL(new Blob([d.prelude], { type: 'text/javascript' }));
          var w = new Worker(url);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 10000);
          w.postMessage({ t: 'boot', code: String(d.code), plugin: d.plugin, network: false }, [e.ports[0]]);
        });
        window.parent.postMessage({ t: 'frameling-plugin-host-ready' }, '*');
      })();
    </script>
  </body>
</html>

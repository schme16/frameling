name: Build desktop apps

# Builds Frameling for Windows, macOS and Linux whenever a pull request targets main, and on demand.
# The installers are attached to the run as artifacts. Windows is signed with a self-signed certificate and macOS is
# ad-hoc signed, so both need allowing once on first run (see the 'Installing Frameling' help topic).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage
          - name: Windows
            os: windows-latest
            args: --win nsis portable
          - name: macOS
            os: macos-latest
            args: --mac dmg --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder skips signing on a pull request build unless this is set, and a pull request into main
          # is exactly where the signing is meant to be tested. Secrets never reach a build from someone's fork.
          CSC_FOR_PULL_REQUEST: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows: signed with Frameling's self-signed code-signing certificate when these secrets are set (an
          # unsigned build otherwise). macOS: ad-hoc signed by build/adhoc-sign.cjs, like Godot. Linux needs neither.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: frameling-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
